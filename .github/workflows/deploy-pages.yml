name: Deploy v1 and v2 to GitHub Pages

# 同一站点同时保留：
# - 根路径：第一版（tag v1.0.0），家长和孩子原来收藏的地址继续可用；
# - /v2/：第二版（v2 分支），独立构建、独立 IndexedDB 库。
#
# 任一分支更新都会重新组装“v1 根路径 + v2 子路径”的完整产物，
# 避免两个部署互相覆盖。

on:
  push:
    branches: [main, v2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout first version
        uses: actions/checkout@v4
        with:
          ref: v1.0.0
          path: v1

      - name: Checkout second version
        uses: actions/checkout@v4
        with:
          ref: v2
          path: v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            v1/package-lock.json
            v2/package-lock.json

      - name: Install and test first version
        working-directory: v1
        run: |
          npm ci
          npm run test

      - name: Build first version at site root
        working-directory: v1
        run: npm run build
        env:
          VITE_BASE: /deep-sea-math/

      - name: Install and test second version
        working-directory: v2
        run: |
          npm ci
          npm run test

      - name: Build second version under /v2/
        working-directory: v2
        run: npm run build
        env:
          VITE_BASE: /deep-sea-math/v2/
          # 两个版本共享同一个 GitHub Pages origin，但绝不能共享 IndexedDB：
          # 第二版新增事件与档案字段，第一版不认识，混用会互相污染。
          VITE_DB_NAME: deep-sea-math-v2

      - name: Assemble both versions
        run: |
          mkdir -p site/v2
          cp -R v1/dist/. site/
          cp -R v2/dist/. site/v2/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
