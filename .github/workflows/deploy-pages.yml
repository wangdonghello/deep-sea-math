name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 部署所需的权限集合（最小权限）。
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次部署，新的推送取消排队中的旧部署。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # jsdom@30 依赖 undici 的 webidl 工具，Node 20 下会抛
          # `webidl.util.markAsUncloneable is not a function`（本地 Node 24 无此问题）。
          # package.json 的 engines 同样声明 >=24，两者保持一致。
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
