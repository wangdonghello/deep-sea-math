name: Deploy v4 to GitHub Pages

# v1（根路径）、v2（/v2/）、v3（/v3/）均已停用，只保留 v4。
# 旧地址访问时走 404 页面或 /v3/ 跳转页，不再构建旧版本。

on:
  push:
    branches: [v4]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fourth version
        uses: actions/checkout@v4
        with:
          ref: v4
          path: v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: v4/package-lock.json

      - name: Install and test fourth version
        working-directory: v4
        run: |
          npm ci
          npm run test

      - name: Build fourth version under /v4/
        working-directory: v4
        run: npm run build
        env:
          VITE_BASE: /deep-sea-math/v4/
          VITE_DB_NAME: deep-sea-math-v4

      - name: Assemble v4 and retired-version notice
        run: |
          mkdir -p site/v4 site/v3
          cp -R v4/dist/. site/v4/
          cat > site/v3/index.html <<'HTML'
          <!doctype html>
          <html lang="zh-CN">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <meta http-equiv="refresh" content="0; url=/deep-sea-math/v4/" />
              <link rel="canonical" href="/deep-sea-math/v4/" />
              <title>v3 已停用，正在前往 v4</title>
            </head>
            <body>
              <p>v3 已停用，正在前往 <a href="/deep-sea-math/v4/">v4</a>。</p>
            </body>
          </html>
          HTML
          cat > site/404.html <<'HTML'
          <!doctype html>
          <html lang="zh-CN">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>页面已停用 · 深海数学探险</title>
              <style>
                body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #071a2e; color: #eaf6ff; font-family: system-ui, sans-serif; }
                main { max-width: 32rem; padding: 2rem; text-align: center; }
                h1 { font-size: 1.5rem; }
                p { color: #a9c6d8; line-height: 1.7; }
                a { display: inline-block; margin: .5rem; padding: .8rem 1.2rem; border-radius: .6rem; background: #2b7a9b; color: white; text-decoration: none; }
              </style>
            </head>
            <body>
              <main>
                <h1>这个旧地址已停用</h1>
                <p>v1、v2、v3 已下线，现在只保留 v4。孩子的进度保存在各自版本的本地数据库中。</p>
                <a href="/deep-sea-math/v4/">进入 v4</a>
              </main>
            </body>
          </html>
          HTML

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
