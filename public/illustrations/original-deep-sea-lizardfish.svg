<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img">
  <title>深海蜥鱼原创示意插画</title>
  <defs>
    <linearGradient id="dl-body" x1="0.1" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#fdf0cf"/>
      <stop offset="0.4" stop-color="#d9bf88"/>
      <stop offset="1" stop-color="#7b6742"/>
    </linearGradient>
    <linearGradient id="dl-fin" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#fdf3d8"/>
      <stop offset="1" stop-color="#9a8355"/>
    </linearGradient>
    <radialGradient id="dl-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd76a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 尾鳍（叉形） -->
  <path d="M200 90 236 66 224 92 236 116Z" fill="url(#dl-fin)" stroke="#fff8e6" stroke-width="3" stroke-linejoin="round"/>
  <path d="M206 90l18-12M206 92l18 12" fill="none" stroke="#a08a5c" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>

  <!-- 身体（细长圆柱形） -->
  <path d="M30 92c4-12 18-20 36-22l62-2c40 0 68 6 80 14l4-4-2 14 4 14-8-4c-12 8-40 12-78 10l-62-4c-18-2-32-8-36-16Z" fill="url(#dl-body)" stroke="#fff8e6" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- 背鳍（靠后，帆状）+ 鳍条 -->
  <path d="M150 68c8-14 22-24 38-26-2 12-4 20-2 28Z" fill="url(#dl-fin)" stroke="#fff8e6" stroke-width="3" stroke-linejoin="round"/>
  <path d="M156 66l4-10M166 60l4-10M176 55l3-10" fill="none" stroke="#a08a5c" stroke-width="2" stroke-linecap="round"/>
  <!-- 脂鳍 -->
  <path d="M190 68c6-6 12-8 18-8-4 4-6 8-6 12Z" fill="url(#dl-fin)" stroke="#fff8e6" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- 臀鳍（与背鳍相对）+ 鳍条 -->
  <path d="M150 112c8 14 22 24 38 26-2-12-4-20-2-28Z" fill="url(#dl-fin)" stroke="#fff8e6" stroke-width="3" stroke-linejoin="round"/>
  <path d="M156 114l4 10M166 120l4 10M176 125l3 10" fill="none" stroke="#a08a5c" stroke-width="2" stroke-linecap="round"/>

  <!-- 侧线 -->
  <path d="M44 92c40 4 88 4 138-2" fill="none" stroke="#5f502f" stroke-opacity="0.35" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 体侧斑块 -->
  <ellipse cx="104" cy="86" rx="7" ry="4" fill="#6d5c38" fill-opacity="0.28"/>
  <ellipse cx="126" cy="86" rx="7" ry="4" fill="#6d5c38" fill-opacity="0.24"/>
  <ellipse cx="148" cy="88" rx="6" ry="4" fill="#6d5c38" fill-opacity="0.22"/>
  <ellipse cx="170" cy="92" rx="6" ry="3.6" fill="#6d5c38" fill-opacity="0.2"/>

  <!-- 吻部（扁平、略上翘） -->
  <path d="M30 92c-10-4-18-6-24-4 6 4 14 7 22 8Z" fill="url(#dl-body)" stroke="#fff8e6" stroke-width="3" stroke-linejoin="round"/>
  <!-- 上颌针状牙 -->
  <path d="M28 88 33 87 30 74Z M40 87 45 86 42 73Z M52 85 57 84 54 72Z M64 85 69 84 66 73Z M76 86 81 85 78 76Z" fill="#fffdf4"/>
  <!-- 下颌针状牙 -->
  <path d="M32 96 37 95 34 106Z M46 97 51 96 48 107Z M60 98 65 97 62 108Z M74 99 79 98 76 109Z" fill="#fffdf4"/>
  <!-- 口线 -->
  <path d="M10 90c14 4 26 6 40 6" fill="none" stroke="#5f502f" stroke-opacity="0.55" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 鳃条 -->
  <path d="M74 74c-4 10-4 22 1 32" fill="none" stroke="#5f502f" stroke-opacity="0.4" stroke-width="3" stroke-linecap="round"/>
  <path d="M82 76c-3 9-3 20 1 28" fill="none" stroke="#5f502f" stroke-opacity="0.25" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 眼睛 -->
  <circle cx="58" cy="80" r="8.5" fill="#fffdf4"/>
  <circle cx="59.5" cy="81" r="5" fill="#241c0e"/>
  <circle cx="56.6" cy="77.8" r="2" fill="#ffffff"/>
  <!-- 胸鳍 -->
  <path d="M86 98c12 8 26 12 40 10-10 8-30 6-42-2Z" fill="url(#dl-fin)" stroke="#fff8e6" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- 眼后发光斑 -->
  <circle cx="88" cy="72" r="6" fill="url(#dl-glow)"/>
  <circle cx="88" cy="72" r="2" fill="#fff0b8"/>
</svg>
