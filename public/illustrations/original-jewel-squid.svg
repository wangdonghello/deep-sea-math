<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img">
  <title>宝石鱿鱼原创示意插画</title>
  <defs>
    <linearGradient id="js-mantle" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffb8ef"/>
      <stop offset="0.45" stop-color="#c06ce0"/>
      <stop offset="1" stop-color="#5a2f9e"/>
    </linearGradient>
    <linearGradient id="js-fin" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffdcf6"/>
      <stop offset="1" stop-color="#a55fc8"/>
    </linearGradient>
    <linearGradient id="js-arm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6a6f0"/>
      <stop offset="1" stop-color="#7b3fb5"/>
    </linearGradient>
    <radialGradient id="js-jewel" cx="0.4" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#b6f6ff"/>
      <stop offset="1" stop-color="#3fd3f0"/>
    </radialGradient>
    <radialGradient id="js-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cdf8ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#54d8f5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="js-eye" cx="0.42" cy="0.36" r="0.7">
      <stop offset="0" stop-color="#fff8d4"/>
      <stop offset="0.55" stop-color="#f0c860"/>
      <stop offset="1" stop-color="#c07918"/>
    </radialGradient>
  </defs>

  <circle cx="110" cy="62" r="60" fill="url(#js-glow)" fill-opacity="0.5"/>

  <!-- 鳍（两块菱形鳍，长在外套膜两侧，向外展开） -->
  <path d="M98 46C80 40 58 42 44 52c20 14 38 24 52 30Z" fill="url(#js-fin)" stroke="#ffe6fb" stroke-width="3" stroke-linejoin="round"/>
  <path d="M122 46c18-6 40-4 54 6-20 14-38 24-52 30Z" fill="url(#js-fin)" stroke="#ffe6fb" stroke-width="3" stroke-linejoin="round"/>
  <path d="M90 54c-10-1-20 1-30 6M90 64c-10 0-19 3-28 9" fill="none" stroke="#ffe6fb" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <path d="M130 54c10-1 20 1 30 6M130 64c10 0 19 3 28 9" fill="none" stroke="#ffe6fb" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>

  <!-- 外套膜（圆锥形） -->
  <path d="M110 14c15 22 24 54 24 82 0 16-10 24-24 24s-24-8-24-24c0-28 9-60 24-82Z" fill="url(#js-mantle)" stroke="#ffe6fb" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- 外套膜高光 -->
  <path d="M104 30c-6 20-9 44-8 66" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round"/>

  <!-- 发光器（“宝石”斑点） -->
  <circle cx="110" cy="42" r="3.4" fill="url(#js-jewel)"/>
  <circle cx="99" cy="52" r="2.6" fill="url(#js-jewel)"/>
  <circle cx="121" cy="52" r="2.6" fill="url(#js-jewel)"/>
  <circle cx="110" cy="58" r="3" fill="url(#js-jewel)"/>
  <circle cx="94" cy="66" r="2.2" fill="url(#js-jewel)"/>
  <circle cx="126" cy="66" r="2.2" fill="url(#js-jewel)"/>
  <circle cx="102" cy="72" r="2.8" fill="url(#js-jewel)"/>
  <circle cx="118" cy="72" r="2.8" fill="url(#js-jewel)"/>
  <circle cx="110" cy="80" r="3.2" fill="url(#js-jewel)"/>
  <circle cx="96" cy="86" r="2.4" fill="url(#js-jewel)"/>
  <circle cx="124" cy="86" r="2.4" fill="url(#js-jewel)"/>
  <circle cx="104" cy="94" r="2.6" fill="url(#js-jewel)"/>
  <circle cx="116" cy="94" r="2.6" fill="url(#js-jewel)"/>
  <circle cx="110" cy="104" r="2.2" fill="url(#js-jewel)"/>
  <circle cx="101" cy="110" r="1.8" fill="url(#js-jewel)"/>
  <circle cx="119" cy="110" r="1.8" fill="url(#js-jewel)"/>

  <!-- 头部 -->
  <path d="M86 116c0 14 10 24 24 24s24-10 24-24Z" fill="url(#js-mantle)" stroke="#ffe6fb" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- 眼睛（左大右小，宝石鱿鱼的招牌特征） -->
  <circle cx="92" cy="124" r="14" fill="url(#js-eye)" stroke="#ffe6fb" stroke-width="2.5"/>
  <circle cx="93" cy="125" r="7" fill="#2a1030"/>
  <circle cx="88.5" cy="120.5" r="3" fill="#ffffff" fill-opacity="0.9"/>
  <circle cx="128" cy="123" r="7.5" fill="url(#js-eye)" stroke="#ffe6fb" stroke-width="2.5"/>
  <circle cx="128.5" cy="124" r="3.6" fill="#2a1030"/>
  <circle cx="126.8" cy="121.8" r="1.5" fill="#ffffff" fill-opacity="0.9"/>
  <!-- 喙 -->
  <path d="M104 138h12l-6 8Z" fill="#2a1030" fill-opacity="0.8"/>

  <!-- 腕足（8 条短腕） -->
  <path d="M92 140c-6 8-10 12-14 16h12c3-6 6-10 10-13Z" fill="url(#js-arm)" stroke="#ffe6fb" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M104 142c-3 7-5 11-7 14h9c1-6 3-10 5-12Z" fill="url(#js-arm)" stroke="#ffe6fb" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M118 142c3 6 5 10 6 14h-9c-1-6-3-10-5-12Z" fill="url(#js-arm)" stroke="#ffe6fb" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M128 140c6 7 11 11 14 16h-12c-3-6-6-10-10-13Z" fill="url(#js-arm)" stroke="#ffe6fb" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- 触腕（更长，带发光末端） -->
  <path d="M88 136c-9 8-16 14-22 18h11c5-6 11-11 17-14Z" fill="url(#js-arm)" fill-opacity="0.92" stroke="#ffe6fb" stroke-width="2" stroke-linejoin="round"/>
  <path d="M132 136c9 8 16 14 22 18h-11c-5-6-11-11-17-14Z" fill="url(#js-arm)" fill-opacity="0.92" stroke="#ffe6fb" stroke-width="2" stroke-linejoin="round"/>

  <!-- 腕足吸盘 -->
  <circle cx="96" cy="146" r="1.3" fill="#ffe6fb" fill-opacity="0.8"/>
  <circle cx="106" cy="148" r="1.3" fill="#ffe6fb" fill-opacity="0.8"/>
  <circle cx="116" cy="148" r="1.3" fill="#ffe6fb" fill-opacity="0.8"/>
  <circle cx="126" cy="146" r="1.3" fill="#ffe6fb" fill-opacity="0.8"/>
  <circle cx="84" cy="146" r="1.2" fill="#ffe6fb" fill-opacity="0.7"/>
  <circle cx="136" cy="146" r="1.2" fill="#ffe6fb" fill-opacity="0.7"/>

  <!-- 腕足末端发光器 -->
  <circle cx="78" cy="156" r="5" fill="url(#js-glow)"/>
  <circle cx="78" cy="156" r="1.8" fill="#d5f9ff"/>
  <circle cx="142" cy="156" r="5" fill="url(#js-glow)"/>
  <circle cx="142" cy="156" r="1.8" fill="#d5f9ff"/>
</svg>
