<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img">
  <title>深海大鼬鳚原创示意插画</title>
  <defs>
    <linearGradient id="ce-body" x1="0.1" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#d8f2ff"/>
      <stop offset="0.45" stop-color="#74b6da"/>
      <stop offset="1" stop-color="#1d4f78"/>
    </linearGradient>
    <linearGradient id="ce-fin" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#eaffff"/>
      <stop offset="1" stop-color="#4d93bd"/>
    </linearGradient>
    <radialGradient id="ce-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8ffee" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#7fe0c0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 尾鳍 -->
  <path d="M214 96c10-9 19-13 24-13-6 7-8 15-5 24-7-2-14-6-19-11Z" fill="url(#ce-fin)" stroke="#eaffff" stroke-width="3" stroke-linejoin="round"/>

  <!-- 身体（细长，向尾部收窄） -->
  <path d="M34 84c4-14 18-24 38-27 34-5 80 1 108 13 22 9 36 18 40 24 3 5-4 10-16 12-30 6-76 10-110 8-30-2-50-10-58-20-4-4-4-7-2-10Z" fill="url(#ce-body)" stroke="#eaffff" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- 背鳍连膜 + 鳍条 -->
  <path d="M78 59C102 49 148 47 186 59c14 6 22 14 28 26-16-11-32-17-56-21-28-5-58-3-80 4Z" fill="url(#ce-fin)" fill-opacity="0.8" stroke="#c8f0ff" stroke-width="2" stroke-linejoin="round"/>
  <path d="M100 56l2-7M124 54l2-7M148 55l2-7M172 61l3-9M196 72l4-9M210 80l4-7" fill="none" stroke="#9ad8f0" stroke-width="2" stroke-linecap="round"/>

  <!-- 臀鳍连膜 + 鳍条 -->
  <path d="M96 116c34 4 72-2 102-12 8-3 14-3 18 0-10 14-42 26-74 28-26 2-44-2-46-16Z" fill="url(#ce-fin)" fill-opacity="0.9" stroke="#c8f0ff" stroke-width="2" stroke-linejoin="round"/>
  <path d="M112 118l-1 8M132 119l-1 10M152 117l-1 11M172 113l0 11M192 107l2 11M206 102l3 10" fill="none" stroke="#9ad8f0" stroke-width="2" stroke-linecap="round"/>

  <!-- 侧线 -->
  <path d="M46 88c40 6 92 8 148 4" fill="none" stroke="#0d3550" stroke-opacity="0.18" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 体侧斑点 -->
  <circle cx="100" cy="78" r="2.6" fill="#0d3550" fill-opacity="0.35"/>
  <circle cx="120" cy="76" r="2.6" fill="#0d3550" fill-opacity="0.35"/>
  <circle cx="140" cy="76" r="2.6" fill="#0d3550" fill-opacity="0.35"/>
  <circle cx="160" cy="79" r="2.4" fill="#0d3550" fill-opacity="0.3"/>
  <circle cx="178" cy="84" r="2.2" fill="#0d3550" fill-opacity="0.28"/>
  <circle cx="194" cy="90" r="2" fill="#0d3550" fill-opacity="0.25"/>

  <!-- 吻部（尖吻） -->
  <path d="M36 84c-6-5-14-6-20-2 4 3 8 5 14 6Z" fill="url(#ce-body)" stroke="#eaffff" stroke-width="3" stroke-linejoin="round"/>
  <!-- 口线 -->
  <path d="M18 84c16 4 30 6 44 6" fill="none" stroke="#0d3550" stroke-opacity="0.5" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 鳃缝 -->
  <path d="M68 62c-4 14-4 30 2 44" fill="none" stroke="#0d3550" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>
  <!-- 眼睛 -->
  <circle cx="56" cy="74" r="7.5" fill="#f2ffff"/>
  <circle cx="57" cy="75" r="4.4" fill="#0a2c44"/>
  <circle cx="54.6" cy="72.4" r="1.8" fill="#ffffff"/>
  <!-- 颏须 -->
  <path d="M52 104c-3 10-1 18 5 24" fill="none" stroke="#d8f2ff" stroke-width="3" stroke-linecap="round"/>
  <!-- 腹鳍条 -->
  <path d="M62 106l-4 12M72 108l-2 12" fill="none" stroke="#c8f0ff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 胸鳍 -->
  <path d="M76 96c12 8 26 12 40 10-10 8-30 6-42-2Z" fill="url(#ce-fin)" stroke="#eaffff" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- 发光器（沿腹缘） -->
  <circle cx="88" cy="118" r="6" fill="url(#ce-glow)"/>
  <circle cx="112" cy="120" r="6" fill="url(#ce-glow)"/>
  <circle cx="138" cy="118" r="6" fill="url(#ce-glow)"/>
  <circle cx="164" cy="112" r="5" fill="url(#ce-glow)"/>
  <circle cx="88" cy="118" r="2.1" fill="#d6ffe9"/>
  <circle cx="112" cy="120" r="2.1" fill="#d6ffe9"/>
  <circle cx="138" cy="118" r="2.1" fill="#d6ffe9"/>
  <circle cx="164" cy="112" r="1.8" fill="#d6ffe9"/>
</svg>
